<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/app.js" type="module"></script>
</head>
<body>
    <div class="calculator">
        <div class="text-box">
            <p></p>
        </div>
        <div class="buttons-box">
            <div class="buttons-row">
                <button class="btn" data-type="cleaner"><p>C</p></button>
                <button class="btn" data-type="number"><p>7</p></button>
                <button class="btn" data-type="number"><p>4</p></button>
                <button class="btn" data-type="number"><p>1</p></button>
                <button class="btn" data-type="number"><p>0</p></button>
            </div>
            <div class="buttons-row">
                <button class="btn" data-type="operator"><p>/</p></button>
                <button class="btn" data-type="number"><p>8</p></button>
                <button class="btn" data-type="number"><p>5</p></button>
                <button class="btn" data-type="number"><p>2</p></button>
                <button class="btn" data-type="number"><p>.</p></button>
            </div>
            <div class="buttons-row">
                <button class="btn" data-type="operator"><p>*</p></button>
                <button class="btn" data-type="number"><p>9</p></button>
                <button class="btn" data-type="number"><p>6</p></button>
                <button class="btn" data-type="number"><p>3</p></button>
                <button class="btn"><p>DEL</p></button>
            </div>
            <div class="buttons-row">
                <button class="btn" data-type="operator"><p>-</p></button>
                <button class="btn" data-type="operator"><p>+</p></button>
                <button class="btn" data-type="equal_sign"><p>=</p></button>
            </div>
        </div>
    </div>
</body>
</html>
